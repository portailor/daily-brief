name: 매일 경제 브리핑

on:
  schedule:
    # UTC 20:45 = 한국시간 05:45.
    # GitHub Actions 의 예약 실행은 정시를 보장하지 않는다. 06:45 로 걸었을 때
    # 실제 시작은 08:22~08:32 로, 1시간 40분가량 밀렸다. 목표 도착이 07:30 이므로
    # 그만큼 앞당겨 건다. 미국장 마감(KST 05:00)은 이 시각에 이미 지나 있다.
    # 요일은 UTC 기준이다. UTC 일~금 20:45 = 한국시간 월~토 05:45.
    # 한국시간 일요일은 새 거래가 없어 쉰다 (코드에서도 한 번 더 막는다).
    - cron: '45 20 * * 0-5'
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행 가능

permissions:
  contents: write           # 리포트와 예측 기록을 커밋하기 위해 필요

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 자격증명 파일 생성
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_FRIENDS: ${{ secrets.KAKAO_FRIENDS }}
        run: |
          mkdir -p config data

          # 어떤 Secret 이 등록됐는지 먼저 보여준다.
          # 값은 절대 찍지 않고 등록 여부만 표시한다.
          echo "── Secrets 등록 상태 ──"
          for name in KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET KAKAO_REFRESH_TOKEN \
                      FRED_API_KEY ECOS_API_KEY DART_API_KEY FINNHUB_API_KEY \
                      KRX_ID KRX_PW REPORT_BASE_URL NAVER_CLIENT_ID NAVER_CLIENT_SECRET \n                      KAKAO_FRIENDS; do
            if [ -n "${!name}" ]; then
              echo "  OK      $name (${#name} chars name, value set)"
            else
              echo "  MISSING $name"
            fi
          done
          echo ""

          # 이 셋이 없으면 브리핑 자체가 의미 없으므로 여기서 멈춘다.
          missing=""
          [ -z "$KAKAO_REST_API_KEY" ] && missing="$missing KAKAO_REST_API_KEY"
          [ -z "$KAKAO_REFRESH_TOKEN" ] && missing="$missing KAKAO_REFRESH_TOKEN"
          [ -z "$FRED_API_KEY" ] && missing="$missing FRED_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::필수 Secret 이 없습니다:$missing"
            echo "저장소 Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi

          # 값은 GitHub Secrets 에만 있고 저장소에는 남지 않는다.
          cat > config/.env <<EOF
          KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
          FRED_API_KEY=$FRED_API_KEY
          ECOS_API_KEY=$ECOS_API_KEY
          DART_API_KEY=$DART_API_KEY
          FINNHUB_API_KEY=$FINNHUB_API_KEY
          KRX_ID=$KRX_ID
          KRX_PW=$KRX_PW
          REPORT_BASE_URL=$REPORT_BASE_URL
          NAVER_CLIENT_ID=$NAVER_CLIENT_ID
          NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
          EOF

          # 함께 받을 사람 목록. 없으면 본인에게만 간다.
          if [ -n "$KAKAO_FRIENDS" ]; then
            printf '%s' "$KAKAO_FRIENDS" > config/friends.json
            echo "친구 목록 파일 생성 완료"
          fi

          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("config/.kakao_token.json").write_text(json.dumps({
              "rest_api_key":  os.environ.get("KAKAO_REST_API_KEY", ""),
              "client_secret": os.environ.get("KAKAO_CLIENT_SECRET", ""),
              "access_token":  "",          # 실행할 때마다 새로 발급받는다
              "refresh_token": os.environ.get("KAKAO_REFRESH_TOKEN", ""),
              "scope": "talk_message",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("자격증명 파일 생성 완료")
          PY

      # 순서가 중요하다: 생성 → 웹에 올리기 → 링크가 열리는지 확인 → 발송.
      # 예전에는 발송이 먼저라, 카톡을 받자마자 링크를 누르면 전날 페이지가 보였다.
      - name: 브리핑 생성
        env:
          PYTHONUTF8: '1'
          TZ: Asia/Seoul
        run: python run.py --no-send --no-publish

      - name: 리포트와 기록 올리기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/predictions.csv data/state.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 카카오톡 발송
        env:
          PYTHONUTF8: '1'
          TZ: Asia/Seoul
        run: python run.py --send-only

      - name: 실행 로그 남기기
        if: always()
        run: tail -40 data/run.log || echo "로그 없음"
