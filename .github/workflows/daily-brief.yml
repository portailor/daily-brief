name: 매일 경제 브리핑

on:
  schedule:
    # ── 왜 두 번, 왜 새벽 3시 30분인가 ─────────────────────────
    # GitHub 의 예약 실행은 정시를 보장하지 않는다. 05:45 로 걸었을 때 실제 시작은
    # 9/13~16 나흘 내내 08:10~08:32 — 매일 2시간 반가량 밀렸다.
    # 그래서 훨씬 일찍 걸고, 일찍 시작되면 그 자리에서 기다렸다가 정해진 시각에 보낸다.
    #   ① 미국장 마감 + 데이터 반영까지 기다린 뒤 생성 (06:15)
    #   ② 발송 시각까지 기다린 뒤 발송 (07:25 → 카톡 도착 07:30 전후)
    # 둘째 줄은 첫 예약이 누락될 때를 위한 예비다. 첫 실행이 이미 보냈으면
    # 둘째 실행은 state.json 의 sent_date 를 보고 곧바로 끝난다.
    # 요일은 UTC 기준: UTC 일~금 = 한국시간 월~토. 한국시간 일요일은 쉰다.
    # 공개 저장소라 기다리는 시간도 Actions 사용량 요금이 붙지 않는다.
    # 9/29: 03:30 예약이 아예 누락됐다(보통은 3시간 늦게 06:30~06:45 에 시작). 예비(05:45)도
    # 평소 08:10~08:33 에야 시작해 카톡이 9시 넘어 간다. 예약을 사이사이 더 걸어 둔다 —
    # 먼저 시작한 하나가 보내면 나머지는 sent_date 를 보고 곧바로 끝난다. 동시에 돌지 않도록
    # concurrency 로 줄을 세우므로 두 번 보낼 일은 없다. (정각·30분은 몰려서 피한다)
    - cron: '30 18 * * 0-5'     # 한국시간 03:30
    - cron: '7 19 * * 0-5'      # 한국시간 04:07 (예비 1)
    - cron: '43 19 * * 0-5'     # 한국시간 04:43 (예비 2)
    - cron: '45 20 * * 0-5'     # 한국시간 05:45 (예비 3)
  # 외부 알람 — GitHub 예약은 늦거나 빠진다(9/29 누락). cron-job.org 가 매일 06:05(한국)에
  # API 로 workflow_dispatch(send=true, wait=true)를 부른다. 예약 실행과 똑같이 기다렸다 보내고,
  # 먼저 보낸 실행이 있으면 건너뛴다. 토큰은 이 저장소 Actions 쓰기 권한만 있는 것.
  workflow_dispatch:            # 수동 실행은 기다리지 않고 바로 만들고 보낸다 (wait=true 면 예약처럼)
    # 주의: 예약 실행에는 inputs 가 비어 있다. GitHub 식에서는 빈 값(null)이 false 와
    # '같다'로 비교되므로 'inputs.send != false' 로 쓰면 매일 아침 발송이 조용히 꺼진다.
    # 그래서 수동 실행일 때만 inputs.send 를 본다.
    inputs:
      send:
        description: '카카오톡·메일도 보낼까요? (false = 페이지만 새로 만들기)'
        type: boolean
        default: true
      wait:
        description: '예약 실행처럼 06:15·07:25 까지 기다리고, 오늘 이미 보냈으면 건너뛸까요? (외부 알람용)'
        type: boolean
        default: false

permissions:
  contents: write           # 리포트와 기록을 커밋하기 위해 필요

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 03:30 에 시작하면 07:25 발송까지 약 4시간을 기다린다
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - name: 오늘 이미 보냈는지 확인
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          WAIT: ${{ inputs.wait }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timedelta, timezone
          today = (datetime.now(timezone.utc) + timedelta(hours=9)).date().isoformat()
          # 체크아웃된 파일이 아니라 지금 main 의 기록을 본다. 체크아웃은 '실행이 걸린 순간'의
          # 커밋이라, 줄 서 있다가 뒤늦게 시작한 실행은 앞 실행이 남긴 발송 기록을 못 본다
          # (9/29: 시험 실행이 '마지막 발송 9/28'로 읽고 다시 만들기 시작해 수동으로 취소했다).
          import subprocess
          subprocess.run(["git", "fetch", "-q", "origin", "main"], check=False)
          remote = subprocess.run(["git", "show", "origin/main:data/state.json"],
                                  capture_output=True, text=True)
          p = pathlib.Path("data/state.json")
          raw = remote.stdout if remote.returncode == 0 else (p.read_text(encoding="utf-8") if p.exists() else "{}")
          sent = json.loads(raw).get("sent_date")
          # 외부 알람(cron-job.org → workflow_dispatch, wait=true)도 예약 실행과 똑같이 다룬다
          scheduled = os.environ["EVENT"] == "schedule" or os.environ.get("WAIT") == "true"
          skip = scheduled and sent == today
          print(f"오늘(한국) {today} · 마지막 발송 {sent} · 건너뜀 {skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"skip={'true' if skip else 'false'}", file=f)
          PY

      - name: 미국장 마감 반영까지 대기 (한국시간 06:15)
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.wait)
        # 미국 정규장 마감은 한국시간 05:00(서머타임) 또는 06:00(표준시).
        # 겨울에도 전날 미국 종가가 확정된 뒤에 만들도록 06:15 까지 기다린다.
        run: python3 scripts/wait_until_kst.py 06:15

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 쇼츠 영상용 — 영상 인코더와 한글 글꼴 (runner 에는 한글 글꼴이 없다)
      - name: ffmpeg·한글 글꼴 설치
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: 자격증명 파일 생성
        if: steps.guard.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_FRIENDS: ${{ secrets.KAKAO_FRIENDS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          COINMARKETCAL_API_KEY: ${{ secrets.COINMARKETCAL_API_KEY }}
        run: |
          mkdir -p config data

          # 어떤 Secret 이 등록됐는지 먼저 보여준다.
          # 값은 절대 찍지 않고 등록 여부만 표시한다.
          echo "── Secrets 등록 상태 ──"
          for name in KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET KAKAO_REFRESH_TOKEN                       FRED_API_KEY ECOS_API_KEY DART_API_KEY FINNHUB_API_KEY                       KRX_ID KRX_PW REPORT_BASE_URL NAVER_CLIENT_ID NAVER_CLIENT_SECRET                       KAKAO_FRIENDS SMTP_USER SMTP_PASS MAIL_TO REB_API_KEY                       COINGECKO_API_KEY DATA_GO_KR_KEY SOSOVALUE_API_KEY COINMARKETCAL_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "  OK      $name (${#name} chars name, value set)"
            else
              echo "  MISSING $name"
            fi
          done
          echo ""

          # 이 셋이 없으면 브리핑 자체가 의미 없으므로 여기서 멈춘다.
          missing=""
          [ -z "$KAKAO_REST_API_KEY" ] && missing="$missing KAKAO_REST_API_KEY"
          [ -z "$KAKAO_REFRESH_TOKEN" ] && missing="$missing KAKAO_REFRESH_TOKEN"
          [ -z "$FRED_API_KEY" ] && missing="$missing FRED_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::필수 Secret 이 없습니다:$missing"
            echo "저장소 Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi

          # 값은 GitHub Secrets 에만 있고 저장소에는 남지 않는다.
          cat > config/.env <<EOF
          KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
          FRED_API_KEY=$FRED_API_KEY
          ECOS_API_KEY=$ECOS_API_KEY
          DART_API_KEY=$DART_API_KEY
          FINNHUB_API_KEY=$FINNHUB_API_KEY
          KRX_ID=$KRX_ID
          KRX_PW=$KRX_PW
          REPORT_BASE_URL=$REPORT_BASE_URL
          NAVER_CLIENT_ID=$NAVER_CLIENT_ID
          NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
          SMTP_USER=$SMTP_USER
          SMTP_PASS=$SMTP_PASS
          MAIL_TO=$MAIL_TO
          REB_API_KEY=$REB_API_KEY
          COINGECKO_API_KEY=$COINGECKO_API_KEY
          DATA_GO_KR_KEY=$DATA_GO_KR_KEY
          SOSOVALUE_API_KEY=$SOSOVALUE_API_KEY
          COINMARKETCAL_API_KEY=$COINMARKETCAL_API_KEY
          EOF

          # 함께 받을 사람 목록. 없으면 본인에게만 간다.
          if [ -n "$KAKAO_FRIENDS" ]; then
            printf '%s' "$KAKAO_FRIENDS" > config/friends.json
            echo "친구 목록 파일 생성 완료"
          fi

          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("config/.kakao_token.json").write_text(json.dumps({
              "rest_api_key":  os.environ.get("KAKAO_REST_API_KEY", ""),
              "client_secret": os.environ.get("KAKAO_CLIENT_SECRET", ""),
              "access_token":  "",          # 실행할 때마다 새로 발급받는다
              "refresh_token": os.environ.get("KAKAO_REFRESH_TOKEN", ""),
              "scope": "talk_message",
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("자격증명 파일 생성 완료")
          PY

      # 순서: 생성 → 웹에 올리기 → (발송 시각까지 대기) → 링크 반영 확인 → 발송
      - name: 브리핑 생성
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONUTF8: '1'
          TZ: Asia/Seoul
        run: python run.py --no-send --no-publish

      - name: 리포트와 기록 올리기
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/predictions.csv data/state.json
          # 신고가 기록은 첫 채우기가 끝나 커밋된 뒤에만 있다. 없는 파일을 git add 하면
          # 단계 전체가 실패해 발송까지 건너뛰므로, 있을 때만 더한다.
          if [ -f data/seoul_highs.json ]; then git add data/seoul_highs.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            # 발송 시각까지 기다리는 동안 다른 커밋이 올라올 수 있다.
            # (9/17 아침, 실행 도중 코드를 올려 push 가 거절되고 발송이 멈췄다.)
            # 충돌은 파일마다 나눠서 푼다 — 예측 기록은 고르지 않고 합친다.
            bash scripts/rebase_onto_main.sh
            git push
          fi

      - name: 발송 시각까지 대기 (한국시간 07:25)
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.wait)
        run: python3 scripts/wait_until_kst.py 07:25

      - name: 카카오톡 발송
        if: steps.guard.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.send)
        env:
          PYTHONUTF8: '1'
          TZ: Asia/Seoul
          # 카톡 발송 직후 쇼츠를 올린다. 없으면 올리기만 건너뛴다.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          # 보내기 직전에 한 번 더 — 기다리는 동안 다른 실행이 이미 보냈을 수 있다 (예약·외부 알람만)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.wait }}" = "true" ]; then
            git fetch -q origin main || true
            SENT=$(git show origin/main:data/state.json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin).get('sent_date',''))" || true)
            TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
            if [ "$SENT" = "$TODAY" ]; then
              echo "오늘($TODAY) 이미 다른 실행이 보냈습니다 — 발송하지 않습니다"
              exit 0
            fi
          fi
          python run.py --send-only

      - name: 발송 기록 올리기
        if: steps.guard.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.send)
        run: |
          git add data/state.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "발송 기록 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            bash scripts/rebase_onto_main.sh && git push
          fi

      # ── 카카오 토큰 자동 교체 ───────────────────────────────
      # 카카오는 refresh_token 잔여 기간이 1개월 미만일 때 새 토큰(60일)을 준다.
      # 매일 도니까 그때마다 Secret 을 갈아 끼우면 토큰은 영영 만료되지 않는다.
      # 기본 GITHUB_TOKEN 은 Secret 을 쓸 권한이 없어 SECRETS_PAT 이 필요하다.
      - name: 카카오 토큰 자동 교체
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          f=data/.kakao_refresh_rotated
          if [ ! -s "$f" ]; then
            echo "새 토큰 없음 — 교체할 것 없음"
            exit 0
          fi
          echo "::add-mask::$(cat "$f")"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::카카오 토큰이 새로 발급됐지만 SECRETS_PAT 이 없어 자동 교체하지 못했습니다. 로컬에서 kakao_auth.py 재인증 후 Secret 을 갱신하세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          echo "✓ KAKAO_REFRESH_TOKEN 자동 교체 완료"
          rm -f "$f"

      - name: 실행 로그 남기기
        if: always()
        run: tail -40 data/run.log || echo "로그 없음"
