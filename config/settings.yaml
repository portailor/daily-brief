# ─────────────────────────────────────────────────────────────
#  매일 경제 브리핑 · 설정
#  kind: price = 가격(수익률 %로 비교) / rate = 금리(bp 차이로 비교)
#  국내장 마감 15:30 KST, 미국장 마감 익일 05:00~06:00 KST 기준
# ─────────────────────────────────────────────────────────────

timezone: Asia/Seoul
send_at: "07:00"

# 받는 사람. 친구 목록은 config/friends.json(비공개)·메일은 MAIL_TO 에 따로 있다.
delivery:
  # 나에게 보내기. 동화님이 친구들에게 보낸 메시지를 자기 카톡에서 보게 되어
  # 같은 브리핑이 두 번 오는 셈이라 2026-09-22 에 껐다. 다시 받으려면 true.
  send_to_me: false

# ── 추적 지표 ────────────────────────────────────────────────
instruments:

  # 한국
  - id: KOSPI
    name: 코스피
    ticker: "^KS11"
    kind: price
    group: kr_equity
    unit: "pt"
    decimals: 2

  - id: KOSDAQ
    name: 코스닥
    ticker: "^KQ11"
    kind: price
    group: kr_equity
    unit: "pt"
    decimals: 2

  - id: USDKRW
    name: 원/달러 환율
    ticker: "KRW=X"
    kind: price
    group: fx
    unit: "원"
    decimals: 2

  # 미국 주식
  - id: SPX
    name: S&P 500
    ticker: "^GSPC"
    kind: price
    group: us_equity
    unit: "pt"
    decimals: 2

  - id: NASDAQ
    name: 나스닥
    ticker: "^IXIC"
    kind: price
    group: us_equity
    unit: "pt"
    decimals: 2

  - id: DOW
    name: 다우존스
    ticker: "^DJI"
    kind: price
    group: us_equity
    unit: "pt"
    decimals: 2

  - id: RUSSELL2000
    name: 러셀 2000
    ticker: "^RUT"
    kind: price
    group: us_equity
    unit: "pt"
    decimals: 2

  # 변동성 · 심리
  - id: VIX
    name: VIX 공포지수
    ticker: "^VIX"
    kind: price
    group: sentiment
    unit: ""
    decimals: 2

  # 금리 (bp로 비교)

  - id: US10Y
    name: 미 국채 10년물
    ticker: "^TNX"
    kind: rate
    group: rates
    unit: "%"
    decimals: 3

  # 원자재 · 달러
  - id: WTI
    name: WTI 원유
    ticker: "CL=F"
    kind: price
    group: commodity
    unit: "$"
    decimals: 2
    futures: true         # 최근월물 연결 — 월물 교체일 가짜 변동 가능

  - id: BRENT
    name: 브렌트유
    ticker: "BZ=F"
    kind: price
    group: commodity
    unit: "$"
    decimals: 2
    futures: true         # 최근월물 연결 — 월물 교체일 가짜 변동 가능

  - id: GOLD
    name: 국제 금
    ticker: "GC=F"
    kind: price
    group: commodity
    unit: "$"
    decimals: 2
    futures: true         # 최근월물 연결 — 월물 교체일 가짜 변동 가능

  - id: COPPER
    name: 구리
    ticker: "HG=F"
    kind: price
    group: commodity
    unit: "$"
    decimals: 4
    futures: true         # 최근월물 연결 — 월물 교체일 가짜 변동 가능

  - id: DXY
    name: 달러인덱스
    ticker: "DX-Y.NYB"
    kind: price
    group: fx
    unit: ""
    decimals: 2

  
  # ── 한국 금리 (ECOS = 한국은행 공식 고시) ───────────────────
  - id: KTB3Y
    name: 국고채 3년물
    kind: rate
    group: kr_rates
    source: ecos
    unit: "%"
    decimals: 3

  - id: KR_BASE
    name: 한국 기준금리
    kind: rate
    group: kr_rates
    source: ecos
    predict: false        # 금통위 회의 때만 바뀐다 — 예측·이례도 판단에서 제외
    unit: "%"
    decimals: 2

# ── 분석 파라미터 ────────────────────────────────────────────
analysis:
  sigma_window: 60        # 이례도(σ) 계산에 쓸 거래일 수
  range_window: 252       # 52주 밴드 (거래일 기준)
  ma_windows: [20, 60, 200]
  sigma_notable: 1.5      # 이 값 넘으면 "오늘 볼 것"으로 승격
  sigma_extreme: 2.5      # 이 값 넘으면 최상단 경보

# ── 내 관심 종목 (금액·수량은 저장하지 않음) ──────────────────
watchlist:
  kr: []                  # 예: ["005930", "000660"]
  us: []                  # 예: ["NVDA", "AAPL"]

# ── 유튜브 쇼츠 ─────────────────────────────────────────────
# 카톡과 같은 내용을 캐릭터가 읽는 영상(brief/shorts). 영상은 매일 만들고,
# 올리기는 카톡 발송 직후. 자격증명은 scripts/youtube_auth.py 로 한 번 받는다.
# 감사 받지 않은 API 프로젝트는 public 으로 올려도 유튜브가 비공개로 잠근다.
shorts:
  upload: true
  privacy: public
